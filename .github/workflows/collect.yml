name: 采集汇率数据

on:
  schedule:
    # 以下均为 UTC 时间，+8 = 北京时间
    # 自链全天不间断，cron 仅作为备用恢复（GitHub cron 不可靠，不能依赖）
    - cron: '0 0 * * *'     # 北京 08:00 — 备用恢复 + 每日日线刷新
    - cron: '0 2 * * *'     # 北京 10:00 — 备用恢复
  workflow_dispatch:  # 手动触发

concurrency:
  group: collect
  cancel-in-progress: true   # 防止多链并行：新触发会取消正在等待的旧 run

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 更新年度外汇日线数据 (每日首次, ~08:05)
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MIN=$(TZ='Asia/Shanghai' date +%M)
          if [ "$BEIJING_HOUR" = "08" ] && [ "$BEIJING_MIN" -lt "15" ]; then
            echo "🔄 每日首次运行，刷新 fx_daily.json..."
            python update_fx_daily.py
          else
            echo "⏭️  非每日首次，跳过 (当前: ${BEIJING_HOUR}:${BEIJING_MIN})"
          fi

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )

      - name: 自链触发下一轮（全天不间断，永不断裂）
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)

          # 08:00-23:00：白天模式，间隔约10分钟
          if [ "$BEIJING_HOUR" -ge 8 ] && [ "$BEIJING_HOUR" -lt 23 ]; then
            echo "☀️ 白天模式，等待570秒，使总间隔约10分钟..."
            sleep 570
          else
            # 23:00-08:00：夜间守护模式，间隔1小时
            # 采集脚本会自动跳过非采集时段（不访问银行），仅保持自链不断
            echo "🌙 夜间守护模式，等待3600秒（1小时），保持自链不断..."
            sleep 3600
          fi

          echo "🚀 触发下一次采集..."

          for i in 1 2 3; do
            if gh workflow run collect.yml --repo ${{ github.repository }} 2>&1; then
              echo "✅ 已触发下一次"
              exit 0
            fi
            echo "⚠️ 触发失败（第${i}次），60秒后重试..."
            sleep 60
          done
          echo "❌ 3次重试均失败，链条中断，等待 cron 备用恢复"
