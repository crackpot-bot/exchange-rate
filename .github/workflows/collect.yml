name: 采集汇率数据

on:
  schedule:
    # 每30分钟作为备用触发（GitHub 对 */5 限流严重）
    # 08:00 的 cron 会恢复暂停后的自链条
    - cron: '0,30 * * * *'
  workflow_dispatch:  # 允许手动触发和自链触发

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许推送提交
      actions: write    # 允许触发 workflow（自链）

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 更新年度外汇日线数据 (每日一次, ~08:05)
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MIN=$(TZ='Asia/Shanghai' date +%M)
          if [ "$BEIJING_HOUR" = "08" ] && [ "$BEIJING_MIN" -lt "15" ]; then
            echo "🔄 每日首次运行，刷新 fx_daily.json..."
            python update_fx_daily.py
          else
            echo "⏭️  非每日首次，跳过 fx 数据更新 (当前: ${BEIJING_HOUR}:${BEIJING_MIN})"
          fi

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )

      - name: 智能自链触发
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$BEIJING_HOUR" -ge 0 ] && [ "$BEIJING_HOUR" -lt 8 ]; then
            echo "⏸️  北京时间 $BEIJING_HOUR 点，暂停期间不自链，等待 08:00 cron 恢复"
            exit 0
          fi
          echo "⏳ 等待240秒，使总间隔约5分钟..."
          sleep 240
          echo "🚀 触发下一次采集..."
          gh workflow run collect.yml --repo ${{ github.repository }}
          echo "✅ 已触发，当前运行结束"
