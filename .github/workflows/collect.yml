name: 采集汇率数据

on:
  schedule:
    # 每5分钟运行一次 (UTC时间)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [main]
    paths:
      - 'cloud_collector.py'
      - '.github/workflows/collect.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送提交

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )
