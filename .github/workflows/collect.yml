name: 采集汇率数据

on:
  schedule:
    # UTC 0-15 = 北京时间 08:00-23:50，每10分钟一次
    - cron: '*/10 0-15 * * *'
  workflow_dispatch:  # 手动触发（测试用）

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 更新年度外汇日线数据 (每日一次, ~08:05)
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MIN=$(TZ='Asia/Shanghai' date +%M)
          if [ "$BEIJING_HOUR" = "08" ] && [ "$BEIJING_MIN" -lt "15" ]; then
            echo "🔄 每日首次运行，刷新 fx_daily.json..."
            python update_fx_daily.py
          else
            echo "⏭️  非每日首次，跳过 fx 数据更新 (当前: ${BEIJING_HOUR}:${BEIJING_MIN})"
          fi

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )
