name: 采集汇率数据

on:
  schedule:
    # 以下均为 UTC 时间，+8 = 北京时间
    - cron: '0 0 * * *'     # 北京 08:00 — 主启动
    - cron: '0 1 * * *'     # 北京 09:00 — 备用启动1
    - cron: '0 2 * * *'     # 北京 10:00 — 备用启动2
    - cron: '0 4 * * *'     # 北京 12:00 — 备用启动3
  workflow_dispatch:  # 手动触发

concurrency:
  group: collect
  cancel-in-progress: true   # 防止多链并行：新触发会取消正在等待的旧 run

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 更新年度外汇日线数据 (每日首次, ~08:05)
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MIN=$(TZ='Asia/Shanghai' date +%M)
          if [ "$BEIJING_HOUR" = "08" ] && [ "$BEIJING_MIN" -lt "15" ]; then
            echo "🔄 每日首次运行，刷新 fx_daily.json..."
            python update_fx_daily.py
          else
            echo "⏭️  非每日首次，跳过 (当前: ${BEIJING_HOUR}:${BEIJING_MIN})"
          fi

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )

      - name: 自链触发下一轮 (08:00-23:00)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)

          # 凌晨 00:00-08:00：不自链，等 cron 早上 8 点重新启动
          if [ "$BEIJING_HOUR" -ge 0 ] && [ "$BEIJING_HOUR" -lt 8 ]; then
            echo "⏸️  北京时间 ${BEIJING_HOUR} 点，停止自链，等待 cron 08:00 重新启动"
            exit 0
          fi

          # 23:00-24:00：不自链，今日采集结束
          if [ "$BEIJING_HOUR" -ge 23 ]; then
            echo "🌙 北京时间 ${BEIJING_HOUR} 点，今日采集结束，等待明天 cron 08:00 重新启动"
            exit 0
          fi

          # 08:00-23:00：等待后自链
          echo "⏳ 等待570秒，使总间隔约10分钟..."
          sleep 570
          echo "🚀 触发下一次采集..."

          for i in 1 2 3; do
            if gh workflow run collect.yml --repo ${{ github.repository }} 2>&1; then
              echo "✅ 已触发下一次"
              exit 0
            fi
            echo "⚠️ 触发失败（第${i}次），60秒后重试..."
            sleep 60
          done
          echo "❌ 3次重试均失败，链条中断，等待 cron 08:00 恢复"
