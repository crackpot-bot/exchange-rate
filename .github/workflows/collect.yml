name: 采集汇率数据

on:
  # ⚠️ GitHub schedule 已移除 — 在公开仓库上延迟 9-12h，且会因 concurrency 取消自链
  # 主触发器：Vercel Cron 每天 09:20 CST 精准触发 (见 vercel.json 及 /api/trigger.js)
  workflow_dispatch:  # 手动触发 / Vercel Cron 触发

concurrency:
  group: collect
  cancel-in-progress: false  # 不取消正在运行的 job，让自链验证步骤完整执行

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 防止卡死阻塞队列
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests==2.31.0 beautifulsoup4==4.12.2 lxml==4.9.3

      - name: 运行采集脚本
        run: python cloud_collector.py

      - name: 更新年度外汇日线数据 (每日首次, ~09:20)
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)
          BEIJING_MIN=$(TZ='Asia/Shanghai' date +%M)
          if [ "$BEIJING_HOUR" = "09" ] && [ "$BEIJING_MIN" -lt "35" ]; then
            echo "🔄 每日首次运行，刷新 fx_daily.json..."
            python update_fx_daily.py
          else
            echo "⏭️  非每日首次，跳过 (当前: ${BEIJING_HOUR}:${BEIJING_MIN})"
          fi

      - name: 提交数据更新
        run: |
          git config user.name "汇率机器人"
          git config user.email "bot@exchange-rate.local"
          git add data/
          git diff --cached --quiet || (
            git commit -m "📊 自动采集 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )

      - name: 自链触发下一轮 (09:00-23:00)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          BEIJING_HOUR=$(TZ='Asia/Shanghai' date +%H)

          # 凌晨 00:00-09:00：不自链，等 Vercel Cron 09:20 启动
          if [ "$BEIJING_HOUR" -ge 0 ] && [ "$BEIJING_HOUR" -lt 9 ]; then
            echo "⏸️  北京时间 ${BEIJING_HOUR} 点，停止自链，等待 Vercel Cron 09:20 启动"
            exit 0
          fi

          # 23:00-24:00：不自链，今日采集结束
          if [ "$BEIJING_HOUR" -ge 23 ]; then
            echo "🌙 北京时间 ${BEIJING_HOUR} 点，今日采集结束"
            exit 0
          fi

          # 09:00-23:00：等待后自链
          echo "⏳ 等待570秒，使总间隔约10分钟..."
          sleep 570
          echo "🚀 触发下一次采集..."

          CURRENT_RUN_ID="${{ github.run_id }}"
          CHAIN_OK=false

          for i in 1 2 3; do
            # 用 GitHub API 直接触发 workflow_dispatch（比 gh CLI 更可靠）
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -d '{"ref":"main"}')

            if [ "$HTTP_CODE" != "204" ]; then
              echo "⚠️ 触发失败 (HTTP $HTTP_CODE, 第${i}次)，60秒后重试..."
              sleep 60
              continue
            fi
            echo "📤 API 触发成功 (HTTP 204, 第${i}次)"

            # 等待新 run 注册后验证
            sleep 15

            NEW_RUN_ID=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(next((str(r['id']) for r in d.get('workflow_runs',[]) if str(r['id'])!='$CURRENT_RUN_ID'), ''))" 2>/dev/null)

            if [ -n "$NEW_RUN_ID" ]; then
              echo "✅ 已验证新 Run 创建 (ID: $NEW_RUN_ID)"
              CHAIN_OK=true
              break
            fi

            echo "⚠️ 未检测到新 Run（第${i}次），60秒后重试..."
            sleep 60
          done

          if [ "$CHAIN_OK" = false ]; then
            echo "❌ 3次重试均失败，自链中断！等待 Vercel Cron 14:00 安全网恢复"
            exit 1
          fi
