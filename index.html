<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💱 美元汇率实时比对 · 工商银行 vs 农业银行</title>
    <script src="static/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5; --card-bg: #fff; --text: #1a1a2e; --text-secondary: #6b7280;
            --border: #e5e7eb; --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 10px;
            --icbc: #c8102e; --abc: #009a44;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; }

        .header {
            background: linear-gradient(135deg, #0f1d35 0%, #1a365d 40%, #2563eb 100%);
            color: #fff; padding: 20px 0; margin-bottom: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.12);
            position: sticky; top: 0; z-index: 100;
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header .badge { font-size: 0.78rem; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
        .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
        .card h3 { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }

        .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; text-align: center; }
        .stat-value { font-size: 1.4rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }

        .bank-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .bank-card { border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 2px solid transparent; }
        .bank-card.icbc { border-color: var(--icbc); background: #fef5f7; }
        .bank-card.abc { border-color: var(--abc); background: #f2faf6; }
        .bank-card.best { box-shadow: 0 0 0 3px #f59e0b, 0 4px 12px rgba(0,0,0,0.1); }
        .bank-card .bank-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .bank-card .bank-logo { width: 28px; height: 28px; }
        .bank-card .bank-name { font-size: 0.95rem; font-weight: 600; }
        .bank-card .best-tag { font-size: 0.7rem; background: #f59e0b; color: #fff; padding: 2px 8px; border-radius: 10px; }
        .bank-card .rate-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; border-bottom: 1px dashed rgba(0,0,0,0.06); }
        .bank-card .rate-row:last-child { border: none; }
        .bank-card .rate-label { font-size: 0.8rem; color: var(--text-secondary); }
        .bank-card .rate-value { font-size: 1.15rem; font-weight: 700; }
        .bank-card .rate-value.buy { color: var(--text-secondary); font-size: 0.9rem; }
        .bank-card.icbc .rate-value.sell { color: var(--icbc); }
        .bank-card.abc .rate-value.sell { color: var(--abc); }
        .bank-card .spread { font-size: 0.7rem; color: var(--text-secondary); background: #f3f4f6; padding: 2px 8px; border-radius: 8px; }

        .chart-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
        .chart-card .chart-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chart-card .chart-header h3 { margin: 0; }

        /* ─── 时间范围选择器 ─── */
        .range-selector { display: flex; gap: 4px; flex-wrap: wrap; }
        .range-btn {
            padding: 4px 12px; font-size: 0.78rem; border: 1px solid var(--border);
            background: #fff; color: var(--text-secondary); border-radius: 20px; cursor: pointer;
            transition: all 0.15s; white-space: nowrap;
        }
        .range-btn:hover { border-color: #2563eb; color: #2563eb; }
        .range-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .chart-wrap { position: relative; width: 100%; height: 340px; }
        .chart-status { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; text-align: right; }

        /* ─── 年度波动分析 ─── */
        .annual-chart-wrap { position: relative; width: 100%; height: 380px; }

        .year-selector { display: flex; gap: 4px; }
        .year-btn {
            padding: 4px 14px; font-size: 0.8rem; border: 1.5px solid var(--border);
            background: #fff; color: var(--text-secondary); border-radius: 20px; cursor: pointer;
            transition: all 0.15s; font-weight: 500;
        }
        .year-btn:hover { border-color: #d97706; color: #d97706; }
        .year-btn.active { background: #d97706; color: #fff; border-color: #d97706; }

        .annual-stats-row { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-top: 14px; }
        .annual-stat-item { text-align: center; padding: 8px; background: #f9fafb; border-radius: 8px; }
        .annual-stat-val { font-size: 1.1rem; font-weight: 700; }
        .annual-stat-val.down { color: #059669; }
        .annual-stat-val.up { color: #c8102e; }
        .annual-stat-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }

        .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .history-table th { background: #f9fafb; padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
        .history-table th:hover { background: #f0f2f5; }
        .history-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .history-table .sell-icbc { color: var(--icbc); font-weight: 600; }
        .history-table .sell-abc { color: var(--abc); font-weight: 600; }
        .history-table .bank-icbc { color: var(--icbc); }
        .history-table .bank-abc { color: var(--abc); }
        tr:hover td { background: #f9fafb; }

        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

        .footer { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 0.78rem; }

        @media (max-width: 700px) {
            .bank-cards { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(3,1fr); gap: 8px; }
            .stat-value { font-size: 1.1rem; }
            .header h1 { font-size: 1.1rem; }
            .chart-wrap { height: 260px; }
            .range-btn { padding: 3px 8px; font-size: 0.72rem; }
            .annual-chart-wrap { height: 280px; }
            .annual-stats-row { grid-template-columns: repeat(3,1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>💱 美元汇率实时比对</h1>
            <div class="badge"><span class="dot"></span><span id="updateLabel">自动更新中</span></div>
        </div>
    </div>

    <div class="container">
        <!-- 统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statRecords">--</div>
                <div class="stat-label">采集次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statICBCSell">--</div>
                <div class="stat-label">工行最新卖出价</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statABCSell">--</div>
                <div class="stat-label">农行最新卖出价</div>
            </div>
        </div>

        <!-- 银行对比卡片 -->
        <div class="bank-cards" id="bankCards">
            <div class="bank-card icbc" id="cardICBC">
                <div class="bank-header">
                    <svg class="bank-logo" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="#c8102e"/><text x="100" y="130" text-anchor="middle" font-size="90" font-weight="bold" fill="white" font-family="serif">工</text></svg>
                    <span class="bank-name">工商银行</span>
                    <span class="best-tag" id="bestICBC" style="display:none">🏆 更划算</span>
                </div>
                <div class="rate-row"><span class="rate-label">卖出价 (换美元)</span><span class="rate-value sell" id="icbcSell">--</span></div>
                <div class="rate-row"><span class="rate-label">买入价 (换人民币)</span><span class="rate-value buy" id="icbcBuy">--</span></div>
                <div class="rate-row"><span class="rate-label">更新时间</span><span class="rate-label" id="icbcTime">--</span></div>
            </div>
            <div class="bank-card abc" id="cardABC">
                <div class="bank-header">
                    <svg class="bank-logo" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="#009a44"/><text x="100" y="130" text-anchor="middle" font-size="90" font-weight="bold" fill="white" font-family="serif">农</text></svg>
                    <span class="bank-name">农业银行</span>
                    <span class="best-tag" id="bestABC" style="display:none">🏆 更划算</span>
                </div>
                <div class="rate-row"><span class="rate-label">卖出价 (换美元)</span><span class="rate-value sell" id="abcSell">--</span></div>
                <div class="rate-row"><span class="rate-label">买入价 (换人民币)</span><span class="rate-value buy" id="abcBuy">--</span></div>
                <div class="rate-row"><span class="rate-label">更新时间</span><span class="rate-label" id="abcTime">--</span></div>
            </div>
        </div>

        <!-- 走势图 -->
        <div class="chart-card">
            <div class="chart-header">
                <h3 id="chartTitle">📈 汇率走势 · 近24小时</h3>
                <div class="range-selector">
                    <button class="range-btn active" data-range="24h" data-label="近24小时">24小时</button>
                    <button class="range-btn" data-range="7d" data-label="近7天">7天</button>
                    <button class="range-btn" data-range="30d" data-label="近30天">1月</button>
                    <button class="range-btn" data-range="90d" data-label="近1季度">1季度</button>
                    <button class="range-btn" data-range="365d" data-label="近1年">1年</button>
                </div>
            </div>
            <div class="chart-wrap"><canvas id="rateChart"></canvas></div>
            <div class="chart-status" id="chartStatus"></div>
        </div>

        <!-- ═══════════ 年度波动分析 ═══════════ -->
        <div class="chart-card">
            <div class="chart-header">
                <h3>📅 年度波动分析 · 美元人民币</h3>
                <div class="year-selector">
                    <button class="year-btn active" data-year="all">全部 (2025-2026)</button>
                    <button class="year-btn" data-year="2025">2025年</button>
                    <button class="year-btn" data-year="2026">2026年至今</button>
                </div>
            </div>
            <div class="annual-chart-wrap"><canvas id="annualChart"></canvas></div>
            <div class="annual-stats-row" id="annualStats"></div>
        </div>

        <!-- 历史记录 -->
        <div class="card">
            <h3>📋 历史记录 <span id="historyCount" style="font-weight:400;font-size:0.8rem;color:var(--text-secondary)">(--)</span></h3>
            <div style="overflow-x:auto">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th onclick="sortHistory('fetched_at')">时间 ▾</th>
                            <th>银行</th>
                            <th onclick="sortHistory('selling_rate')">卖出价 ▾</th>
                            <th onclick="sortHistory('buying_rate')">买入价 ▾</th>
                            <th>价差</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"><tr><td colspan="5" class="empty-state"><div class="icon">📡</div>加载中...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            数据来源 cnyrate.com · GitHub Actions 自动采集 · 08:00-24:00 每5分钟更新 · 北京时间
            <br><span id="lastFetch" style="opacity:0.7"></span>
        </div>
    </div>

<script>
// ═══════════ 状态 ═══════════
let currentRates = [];
let historyData = [];        // 全量历史（前端缓存）
let rateChart = null;
let histSortField = 'fetched_at';
let histSortDir = 'desc';
let currentRange = '24h';

const BANK_LABELS = { 'ICBC': '工商银行', 'ABC': '农业银行' };

// 时间范围配置
const RANGE_CONFIG = {
    '24h':  { ms: 1  * 24 * 3600 * 1000, label: '近24小时', maxPoints: 300,  fmt: t => t.substring(11,16) },
    '7d':   { ms: 7  * 24 * 3600 * 1000, label: '近7天',   maxPoints: 200,  fmt: t => t.substring(5,16) },
    '30d':  { ms: 30 * 24 * 3600 * 1000, label: '近30天',  maxPoints: 250,  fmt: t => t.substring(5,10) },
    '90d':  { ms: 90 * 24 * 3600 * 1000, label: '近1季度',  maxPoints: 250,  fmt: t => t.substring(5,10) },
    '365d': { ms: 365* 24 * 3600 * 1000, label: '近1年',   maxPoints: 365,  fmt: t => t.substring(0,7) },
};

// ═══════════ 时间范围过滤 ═══════════
function getBeijingNowStr() {
    // 返回北京时间的 "YYYY-MM-DD HH:MM:SS" 字符串
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const beijing = new Date(utc + 8 * 3600 * 1000);
    return beijing.getFullYear() + '-' +
           String(beijing.getMonth() + 1).padStart(2,'0') + '-' +
           String(beijing.getDate()).padStart(2,'0') + ' ' +
           String(beijing.getHours()).padStart(2,'0') + ':' +
           String(beijing.getMinutes()).padStart(2,'0') + ':' +
           String(beijing.getSeconds()).padStart(2,'0');
}

function filterByRange(range) {
    const cfg = RANGE_CONFIG[range];
    if (!cfg) return [];

    // 计算截止时间字符串（北京时间）
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const beijingNow = new Date(utc + 8 * 3600 * 1000);
    const cutoff = new Date(beijingNow.getTime() - cfg.ms);
    const cutoffStr = cutoff.getFullYear() + '-' +
                      String(cutoff.getMonth() + 1).padStart(2,'0') + '-' +
                      String(cutoff.getDate()).padStart(2,'0') + ' ' +
                      String(cutoff.getHours()).padStart(2,'0') + ':' +
                      String(cutoff.getMinutes()).padStart(2,'0') + ':' +
                      String(cutoff.getSeconds()).padStart(2,'0');

    return historyData.filter(r => (r.fetched_at || '') >= cutoffStr);
}

// ═══════════ 降采样 ═══════════
function downsample(times, datasets, maxPoints) {
    if (times.length <= maxPoints) return { times, datasets };

    const step = Math.ceil(times.length / maxPoints);
    const newTimes = [];
    const newDatasets = datasets.map(ds => []);

    for (let i = 0; i < times.length; i += step) {
        // 取每个区间的最后一个非null值
        newTimes.push(times[i]);
        for (let d = 0; d < datasets.length; d++) {
            let val = null;
            for (let j = i; j < Math.min(i + step, times.length); j++) {
                if (datasets[d][j] !== null && datasets[d][j] !== undefined) {
                    val = datasets[d][j];
                }
            }
            newDatasets[d].push(val);
        }
    }
    return { times: newTimes, datasets: newDatasets };
}

// ═══════════ 数据加载 ═══════════
let fxDailyData = [];          // 外汇日线数据
let annualChart = null;
let currentYear = 'all';

async function loadData() {
    try {
        const [latestRes, histRes] = await Promise.all([
            fetch('data/latest.json?_=' + Date.now()),
            fetch('data/history.json?_=' + Date.now())
        ]);
        if (latestRes.ok) currentRates = await latestRes.json();
        if (histRes.ok) historyData = await histRes.json();
    } catch(e) {
        console.warn('数据加载失败:', e);
    }
    renderAll();
}

async function loadAnnualData() {
    try {
        const res = await fetch('data/fx_daily.json?_=' + Date.now());
        if (res.ok) fxDailyData = await res.json();
    } catch(e) {
        console.warn('年度数据加载失败:', e);
    }
    renderAnnualChart();
}

// ═══════════ 渲染 ═══════════
function renderAll() {
    renderBankCards();
    renderStats();
    renderChart();
    renderHistory();
    document.getElementById('lastFetch').textContent = '数据刷新: ' + new Date().toLocaleTimeString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false});
}

function renderBankCards() {
    const icbc = currentRates.find(r => r.bank_name === 'ICBC');
    const abc = currentRates.find(r => r.bank_name === 'ABC');

    if (icbc) {
        document.getElementById('icbcSell').textContent = '¥' + icbc.selling_rate.toFixed(2) + ' /100$';
        document.getElementById('icbcBuy').textContent = '¥' + icbc.buying_rate.toFixed(2);
        document.getElementById('icbcTime').textContent = icbc.fetched_at || '--';
    }
    if (abc) {
        document.getElementById('abcSell').textContent = '¥' + abc.selling_rate.toFixed(2) + ' /100$';
        document.getElementById('abcBuy').textContent = '¥' + abc.buying_rate.toFixed(2);
        document.getElementById('abcTime').textContent = abc.fetched_at || '--';
    }

    document.getElementById('cardICBC').classList.remove('best');
    document.getElementById('cardABC').classList.remove('best');
    document.getElementById('bestICBC').style.display = 'none';
    document.getElementById('bestABC').style.display = 'none';

    if (icbc && abc) {
        if (icbc.selling_rate < abc.selling_rate) {
            document.getElementById('cardICBC').classList.add('best');
            document.getElementById('bestICBC').style.display = '';
        } else {
            document.getElementById('cardABC').classList.add('best');
            document.getElementById('bestABC').style.display = '';
        }
    }
}

function renderStats() {
    // 统计当前选中范围内的数据量
    const rangeData = filterByRange(currentRange);
    document.getElementById('statRecords').textContent = Math.floor(rangeData.length / 2) || 0;
    const icbc = currentRates.find(r => r.bank_name === 'ICBC');
    const abc = currentRates.find(r => r.bank_name === 'ABC');
    document.getElementById('statICBCSell').textContent = icbc ? '¥' + icbc.selling_rate.toFixed(2) : '--';
    document.getElementById('statABCSell').textContent = abc ? '¥' + abc.selling_rate.toFixed(2) : '--';
}

function renderChart() {
    const cfg = RANGE_CONFIG[currentRange];
    const filtered = filterByRange(currentRange);

    // 更新标题
    document.getElementById('chartTitle').textContent = '📈 汇率走势 · ' + cfg.label;

    if (filtered.length === 0) {
        document.getElementById('chartStatus').textContent = '该时间范围内暂无数据';
        if (rateChart) { rateChart.destroy(); rateChart = null; }
        return;
    }

    // 按时间分组
    const times = [...new Set(filtered.map(r => r.fetched_at))].sort();
    const icbcByTime = {}, abcByTime = {};
    filtered.forEach(r => {
        if (r.bank_name === 'ICBC') icbcByTime[r.fetched_at] = r;
        else abcByTime[r.fetched_at] = r;
    });

    let labels = times;
    let icbcSell = times.map(t => icbcByTime[t]?.selling_rate ?? null);
    let icbcBuy  = times.map(t => icbcByTime[t]?.buying_rate ?? null);
    let abcSell  = times.map(t => abcByTime[t]?.selling_rate ?? null);
    let abcBuy   = times.map(t => abcByTime[t]?.buying_rate ?? null);

    // 降采样
    const result = downsample(times, [icbcSell, icbcBuy, abcSell, abcBuy], cfg.maxPoints);
    labels = result.times.map(cfg.fmt);
    [icbcSell, icbcBuy, abcSell, abcBuy] = result.datasets;

    // 更新状态信息
    const pointCount = labels.length;
    const timeSpan = times.length > 1 ? times[0].substring(0,10) + ' ~ ' + times[times.length-1].substring(0,10) : times[0]?.substring(0,10) || '';
    document.getElementById('chartStatus').textContent = `${pointCount} 个数据点 · ${timeSpan}`;

    if (!rateChart) {
        const ctx = document.getElementById('rateChart').getContext('2d');
        rateChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label:'工行·卖出', data:icbcSell, borderColor:'#c8102e', backgroundColor:'rgba(200,16,46,0.05)', tension:0.3, pointRadius:0, borderWidth:2, spanGaps:true },
                    { label:'工行·买入', data:icbcBuy, borderColor:'#c8102e', backgroundColor:'transparent', tension:0.3, pointRadius:0, borderWidth:1.5, borderDash:[5,5], spanGaps:true },
                    { label:'农行·卖出', data:abcSell, borderColor:'#009a44', backgroundColor:'rgba(0,154,68,0.05)', tension:0.3, pointRadius:0, borderWidth:2, spanGaps:true },
                    { label:'农行·买入', data:abcBuy, borderColor:'#009a44', backgroundColor:'transparent', tension:0.3, pointRadius:0, borderWidth:1.5, borderDash:[5,5], spanGaps:true },
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode:'index', intersect:false },
                plugins: { legend: { position:'bottom', labels:{usePointStyle:true,boxWidth:20,padding:20}} },
                scales: {
                    x: { ticks:{maxTicksLimit:15}, grid:{display:false} },
                    y: { title:{display:true,text:'¥/100USD'}, ticks:{callback:v=>v.toFixed(2)} }
                }
            }
        });
    } else {
        rateChart.data.labels = labels;
        rateChart.data.datasets[0].data = icbcSell;
        rateChart.data.datasets[1].data = icbcBuy;
        rateChart.data.datasets[2].data = abcSell;
        rateChart.data.datasets[3].data = abcBuy;
        rateChart.update('none');
    }
}

function sortHistory(field) {
    if (histSortField === field) histSortDir = histSortDir === 'asc' ? 'desc' : 'asc';
    else { histSortField = field; histSortDir = 'asc'; }
    renderHistory();
}

function renderHistory() {
    const sorted = [...historyData].sort((a,b) => {
        const va = a[histSortField] ?? '', vb = b[histSortField] ?? '';
        return histSortDir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });

    // 只显示最近200条，避免大量数据卡顿
    const display = sorted.slice(0, 200);
    const tbody = document.getElementById('historyBody');
    document.getElementById('historyCount').textContent = '(' + sorted.length + ' 条' + (sorted.length > 200 ? ', 显示最近200条' : '') + ')';

    if (display.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><div class="icon">📭</div>暂无数据，等待采集...</td></tr>';
        return;
    }

    tbody.innerHTML = display.map(r => {
        const isICBC = r.bank_name === 'ICBC';
        const sellClass = isICBC ? 'sell-icbc' : 'sell-abc';
        const bankClass = isICBC ? 'bank-icbc' : 'bank-abc';
        const sell = typeof r.selling_rate === 'number' ? r.selling_rate : parseFloat(r.selling_rate);
        const buy = typeof r.buying_rate === 'number' ? r.buying_rate : parseFloat(r.buying_rate);
        const spread = (sell - buy).toFixed(3);
        return `<tr>
            <td>${r.fetched_at || '--'}</td>
            <td class="${bankClass}">${BANK_LABELS[r.bank_name] || r.bank_name}</td>
            <td class="${sellClass}">¥${sell.toFixed(3)}</td>
            <td style="color:var(--text-secondary)">¥${buy.toFixed(3)}</td>
            <td style="color:#d97706">¥${spread}</td>
        </tr>`;
    }).join('');
}

// ═══════════ 年度波动折线图 ═══════════
function renderAnnualChart() {
    if (fxDailyData.length === 0) return;

    // 按年份过滤（已按日期降序存储，反转后升序）
    let data = [...fxDailyData].reverse(); // 升序排列
    if (currentYear === '2025') data = data.filter(d => d.date.startsWith('2025'));
    else if (currentYear === '2026') data = data.filter(d => d.date.startsWith('2026'));

    if (data.length === 0) return;

    const labels = data.map(d => d.date.substring(5)); // MM-DD 格式
    const closePrices = data.map(d => d.last);
    const highPrices = data.map(d => d.high);
    const lowPrices = data.map(d => d.low);
    const ranges = data.map(d => +(d.high - d.low).toFixed(4));

    // 计算统计
    const firstClose = closePrices[0], lastClose = closePrices[closePrices.length - 1];
    const totalChange = lastClose - firstClose;
    const avgRange = ranges.length ? +(ranges.reduce((a,b)=>a+b,0)/ranges.length).toFixed(4) : 0;
    const maxRange = ranges.length ? Math.max(...ranges) : 0;
    const minRange = ranges.length ? Math.min(...ranges) : 0;

    // 更新统计卡片
    document.getElementById('annualStats').innerHTML = `
        <div class="annual-stat-item">
            <div class="annual-stat-val">${firstClose.toFixed(4)}</div>
            <div class="annual-stat-label">期初收盘价</div>
        </div>
        <div class="annual-stat-item">
            <div class="annual-stat-val">${lastClose.toFixed(4)}</div>
            <div class="annual-stat-label">最新收盘价</div>
        </div>
        <div class="annual-stat-item">
            <div class="annual-stat-val ${totalChange < 0 ? 'down' : 'up'}">${totalChange < 0 ? '↓' : '↑'} ${Math.abs(totalChange).toFixed(4)}</div>
            <div class="annual-stat-label">累计变动 (人民币${totalChange < 0 ? '升值' : '贬值'})</div>
        </div>
        <div class="annual-stat-item">
            <div class="annual-stat-val">${avgRange.toFixed(4)}</div>
            <div class="annual-stat-label">日均波动 (最高-最低)</div>
        </div>
        <div class="annual-stat-item">
            <div class="annual-stat-val">${maxRange.toFixed(4)}</div>
            <div class="annual-stat-label">最大单日波动</div>
        </div>
    `;

    // 渲染图表
    if (!annualChart) {
        const ctx = document.getElementById('annualChart').getContext('2d');
        annualChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    {
                        label: '最高价',
                        data: highPrices,
                        borderColor: 'rgba(37, 99, 235, 0.3)',
                        backgroundColor: 'transparent',
                        borderWidth: 0.5,
                        pointRadius: 0,
                        fill: false,
                        order: 3,
                    },
                    {
                        label: '最低价',
                        data: lowPrices,
                        borderColor: 'rgba(37, 99, 235, 0.3)',
                        backgroundColor: 'rgba(37, 99, 235, 0.08)',
                        borderWidth: 0.5,
                        pointRadius: 0,
                        fill: '-1',  // fill to dataset index -1 (the high line above)
                        order: 3,
                    },
                    {
                        label: '收盘价',
                        data: closePrices,
                        borderColor: '#d97706',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0.1,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointHoverBackgroundColor: '#d97706',
                        order: 1,
                    },
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            usePointStyle: true,
                            boxWidth: 20,
                            padding: 20,
                            filter: item => item.datasetIndex === 2  // 只显示收盘价图例
                        }
                    },
                    tooltip: {
                        callbacks: {
                            title: items => data[items[0]?.dataIndex]?.date || '',
                            label: ctx => {
                                if (ctx.datasetIndex === 0) return '最高: ' + ctx.raw.toFixed(4);
                                if (ctx.datasetIndex === 1) return '最低: ' + ctx.raw.toFixed(4);
                                if (ctx.datasetIndex === 2) return '收盘: ' + ctx.raw.toFixed(4);
                                return '';
                            },
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            maxTicksLimit: 18,
                            callback: function(val, index) {
                                const label = this.getLabelForValue(val);
                                const step = Math.max(1, Math.ceil(labels.length / 14));
                                return index % step === 0 ? label : '';
                            }
                        },
                        grid: { display: false }
                    },
                    y: {
                        title: { display: true, text: '¥/1USD' },
                        ticks: { callback: v => v.toFixed(2) },
                    }
                }
            }
        });
    } else {
        annualChart.data.labels = labels;
        annualChart.data.datasets[0].data = highPrices;
        annualChart.data.datasets[1].data = lowPrices;
        annualChart.data.datasets[2].data = closePrices;
        annualChart.update('none');
    }
}

// ═══════════ 年份选择器 ═══════════
document.querySelectorAll('.year-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentYear = btn.dataset.year;
        renderAnnualChart();
    });
});
document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRange = btn.dataset.range;
        renderChart();
        renderStats();
    });
});

// ═══════════ 初始化 ═══════════
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    loadAnnualData();
    setInterval(loadData, 30000);
    // 年度数据不频繁刷新，每小时更新一次即可
    setInterval(loadAnnualData, 3600000);
});
</script>
